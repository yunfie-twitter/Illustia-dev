import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "androidx.baselineprofile"
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.ktlint)
    alias(libs.plugins.detekt)
}

ext.releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def androidMinSdk = 24

android {
    namespace "com.yunfie.illustia"
    compileSdk 37
    defaultConfig {
        applicationId "com.yunfie.illustia"
        // Android 7.0 (API 24) and newer.
        minSdk androidMinSdk
        targetSdk 36
        versionCode 45
        versionName "5.5.0-beta.1"
    }

    signingConfigs {
        if (project.ext.releaseKeystorePath) {
            release {
                storeFile file(project.ext.releaseKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig project.ext.releaseKeystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libandroidx.graphics.path.so"]
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

ktlint {
    version = "1.8.0"
    android = true
    outputToConsole = true
    ignoreFailures = false
    filter {
        exclude { element ->
            element.file.absolutePath.replace('\\', '/').contains('/build/generated/')
        }
    }
}

detekt {
    toolVersion = "2.0.0-alpha.5"
    buildUponDefaultConfig = true
    config.setFrom(files("config/detekt/detekt.yml"))
    parallel = true
    ignoreFailures = false
}

def supportedKtlintCheckTasks = [
    "runKtlintCheckOverMainSourceSet",
    "runKtlintCheckOverTestSourceSet",
    "runKtlintCheckOverKotlinScripts",
    "ktlintMainSourceSetCheck",
    "ktlintTestSourceSetCheck",
    "ktlintKotlinScriptCheck",
] as Set

tasks.configureEach { task ->
    if ((task.name.startsWith("runKtlintCheckOver") ||
        (task.name.startsWith("ktlint") && task.name.endsWith("SourceSetCheck"))) &&
        !supportedKtlintCheckTasks.contains(task.name)) {
        task.enabled = false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def name = "Illustia-v${android.defaultConfig.versionName}-${variant.name}.apk"
            output.outputFileName.set(name)
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget("17")
        moduleName = "illustia_app"
    }
}

