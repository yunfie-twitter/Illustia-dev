naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '(?:[A-Z][A-Z0-9_]*|[A-Z][A-Za-z0-9]*)'

complexity:
  CyclomaticComplexMethod:
    ignoreAnnotated:
      - Composable
  LongMethod:
    ignoreAnnotated:
      - Composable
style:
  MagicNumber:
    ignoreAnnotated:
      - Composable
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  # ktlint owns source formatting so the two tools do not report the same issue.
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
