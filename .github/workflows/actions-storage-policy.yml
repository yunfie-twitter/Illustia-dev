name: Actions storage policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: actions-storage-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-zero-storage-policy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject persistent Actions artifacts and caches
        shell: bash
        run: |
          set -euo pipefail

          policy_file=".github/workflows/actions-storage-policy.yml"
          violations_file="${RUNNER_TEMP}/actions-storage-violations.txt"

          grep -RInE \
            --include='*.yml' \
            --include='*.yaml' \
            --exclude="$(basename "$policy_file")" \
            'actions/(upload-artifact|cache)@|Swatinem/rust-cache@|cache:[[:space:]]*(gradle|maven|sbt|npm|yarn|pnpm|pip|poetry|pipenv)|cache-to:[[:space:]]*.*type=gha' \
            .github > "$violations_file" || true

          if [ -s "$violations_file" ]; then
            echo "Persistent Actions storage is forbidden by repository policy:"
            cat "$violations_file"
            exit 1
          fi

          while IFS= read -r workflow_file; do
            if grep -q 'gradle/actions/setup-gradle@' "$workflow_file" && \
               ! grep -qE 'cache-disabled:[[:space:]]*true' "$workflow_file"; then
              echo "$workflow_file: setup-gradle must set cache-disabled: true"
              exit 1
            fi

            if grep -qE 'actions/setup-node@v(5|6)' "$workflow_file" && \
               ! grep -qE 'package-manager-cache:[[:space:]]*false' "$workflow_file"; then
              echo "$workflow_file: setup-node v5+ must set package-manager-cache: false"
              exit 1
            fi
          done < <(find .github -type f \( -name '*.yml' -o -name '*.yaml' \))

  purge-existing-storage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete all Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_ids="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )"

          while IFS= read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "$artifact_ids"

          cache_ids="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
              --jq '.actions_caches[].id'
          )"

          while IFS= read -r cache_id; do
            [ -z "$cache_id" ] && continue
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          done <<< "$cache_ids"

          echo "Actions artifacts and caches have been purged."
